---
# PrimusPost fork: publishes to ghcr.io/abhi9699/postiz-app rather than
# ghcr.io/gitroomhq/postiz-app. A fork cannot push to upstream's registry, so
# without this change the workflow fails at the push step.
#
# Everything else is upstream's — same Dockerfile.dev, same multi-arch matrix,
# same manifest job. Keeping the build itself identical is deliberate: the point
# of this fork is four specific source changes, not a different build.
#
# Trigger with a tag push (`git tag v2.23.0-pp1 && git push origin v2.23.0-pp1`)
# or manually via workflow_dispatch. The tag becomes the image tag.
name: "Build Containers"

on:
  workflow_dispatch:
  push:
    tags:
      - '*'

# Named explicitly rather than inherited. Default token permissions can be
# tightened at the account or org level, and when that happens this workflow
# loses the ability to push images in a way that is confusing to diagnose.
permissions:
  contents: read
  packages: write

jobs:
  build-containers-common:
    runs-on: ubuntu-latest
    outputs:
      containerver: ${{ steps.getcontainerver.outputs.containerver }}
    steps:
      - name: Get Container Version
        id: getcontainerver
        run: |
          echo "containerver=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"

  build-containers:
    needs: build-containers-common
    strategy:
      matrix:
        include:
          - runnertags: ubuntu-latest
            arch: amd64
          - runnertags: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runnertags }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and Push Image
        env:
          CONTAINERVER: ${{ needs.build-containers-common.outputs.containerver }}
          NEXT_PUBLIC_VERSION: ${{ github.ref_name }}
        run: |
          docker buildx build --platform linux/${{ matrix.arch }} \
            -f Dockerfile.dev \
            -t ghcr.io/abhi9699/postiz-app:${{ env.CONTAINERVER }}-${{ matrix.arch }} \
            --build-arg NEXT_PUBLIC_VERSION=${{ env.NEXT_PUBLIC_VERSION }} \
            --pull \
            --no-cache \
            --provenance=false --sbom=false \
            --output "type=registry,name=ghcr.io/abhi9699/postiz-app:${{ env.CONTAINERVER }}-${{ matrix.arch }}" .

  build-container-manifest:
    needs: [build-containers, build-containers-common]
    runs-on: ubuntu-latest
    steps:
      - name: Login to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Create Docker Manifest
        env:
          CONTAINERVER: ${{ needs.build-containers-common.outputs.containerver }}
        run: |
          # Verify the architecture images
          echo "Verifying AMD64 image:"
          docker buildx imagetools inspect ghcr.io/abhi9699/postiz-app:${{ env.CONTAINERVER }}-amd64
          
          echo "Verifying ARM64 image:"
          docker buildx imagetools inspect ghcr.io/abhi9699/postiz-app:${{ env.CONTAINERVER }}-arm64
          
          # Try to remove any existing manifests first
          docker manifest rm ghcr.io/abhi9699/postiz-app:${{ env.CONTAINERVER }} || true
          docker manifest rm ghcr.io/abhi9699/postiz-app:latest || true
          
          # Create and push the version-specific manifest
          docker manifest create ghcr.io/abhi9699/postiz-app:${{ env.CONTAINERVER }} \
            --amend ghcr.io/abhi9699/postiz-app:${{ env.CONTAINERVER }}-amd64 \
            --amend ghcr.io/abhi9699/postiz-app:${{ env.CONTAINERVER }}-arm64

          docker manifest push ghcr.io/abhi9699/postiz-app:${{ env.CONTAINERVER }}

          # Create and push the latest manifest
          docker manifest create ghcr.io/abhi9699/postiz-app:latest \
            --amend ghcr.io/abhi9699/postiz-app:${{ env.CONTAINERVER }}-amd64 \
            --amend ghcr.io/abhi9699/postiz-app:${{ env.CONTAINERVER }}-arm64

          docker manifest push ghcr.io/abhi9699/postiz-app:latest

      - name: Verify Manifest
        run: |
          docker manifest inspect ghcr.io/abhi9699/postiz-app:latest
